<!DOCTYPE html>
<html>

<head>
  <!-- Basic -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- Mobile Metas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <!-- Site Metas -->
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta name="author" content="" />

  <title>Blog Admin - Holiwells</title>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">

  <!-- bootstrap core css -->
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
  <!-- font awesome style -->
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css" />

  <!-- Custom styles for this template -->
  <link href="css/style.css" rel="stylesheet" />
  <!-- responsive style -->
  <link href="css/responsive.css" rel="stylesheet" />

  <style>
    .admin-container {
      max-width: 900px;
      margin: 50px auto;
      padding: 30px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }
    .login-form {
      max-width: 400px;
      margin: 100px auto;
      padding: 40px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }
    .login-form h2 {
      text-align: center;
      color: #00204a;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: 500;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }
    .form-group textarea {
      min-height: 200px;
      resize: vertical;
    }
    .btn-primary {
      background: #00204a;
      color: #fff;
      padding: 12px 30px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn-primary:hover {
      background: #003366;
    }
    .btn-danger {
      background: #dc3545;
      color: #fff;
      padding: 8px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-logout {
      float: right;
      background: #6c757d;
    }
    .post-list {
      margin-top: 40px;
    }
    .post-item {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 15px;
      background: #f9f9f9;
    }
    .post-item h4 {
      color: #00204a;
      margin-bottom: 10px;
    }
    .post-meta {
      color: #666;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .alert {
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 5px;
    }
    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    #adminPanel {
      display: none;
    }
  </style>

</head>

<body>

  <!-- Login Form -->
  <div id="loginForm" class="login-form">
    <h2>Blog Admin Login</h2>
    <div id="loginError" style="display: none;" class="alert alert-error"></div>
    <form onsubmit="return login(event)">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
    </form>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel">
    <div class="admin-container">
      <h2 style="color: #00204a;">Blog Administration</h2>
      <button onclick="logout()" class="btn-primary btn-logout">Logout</button>
      <div style="clear: both;"></div>

      <div id="message" style="display: none; margin-top: 20px;"></div>

      <form id="postForm" onsubmit="return savePost(event)" style="margin-top: 30px;">
        <div class="form-group">
          <label for="postTitle">Post Title</label>
          <input type="text" id="postTitle" required>
        </div>
        <div class="form-group">
          <label for="postContent">Post Content</label>
          <textarea id="postContent" required></textarea>
        </div>
        <button type="submit" class="btn-primary">Publish Post</button>
      </form>

      <div class="post-list">
        <h3 style="color: #00204a;">Published Posts</h3>
        <div id="postsList"></div>
      </div>
    </div>
  </div>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/blog-admin.js"></script>

</body>

</html>
